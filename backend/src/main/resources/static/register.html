<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration - Doctor Availability & Scheduling System</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background-color: var(--bg-main);">

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="navbar-brand">
        <div class="brand-icon">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
        </div>
        <span>Aura Health</span>
      </a>

      <ul class="navbar-nav">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="doctors.html" class="nav-link">Find Doctors</a></li>
      </ul>

      <div class="navbar-actions">
        <span style="font-size:13px;color:var(--text-secondary);">Already registered?</span>
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <main class="auth-wrapper" style="padding: 40px 16px;">
    <div class="auth-card" style="max-width: 580px;">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 16px; width:48px; height:48px;">
          <svg width="26" height="26" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
        </div>
        <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main);">Create Patient Account</h2>
        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">
          Access specialist doctors, track medical consultations, and view receipts
        </p>
      </div>

      <div id="register-error-alert" style="display:none; padding:12px; border-radius:var(--radius-md); background:var(--status-error-bg); color:var(--status-error); font-size:13px; margin-bottom:16px;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-name" class="form-label">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Johnathan Miller" required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label for="reg-email" class="form-label">Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="patient@example.com" required>
          </div>
          <div class="form-group">
            <label for="reg-phone" class="form-label">Phone Number *</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+1-800-555-0100" required>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label for="reg-password" class="form-label">Password *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
          </div>
          <div class="form-group">
            <label for="reg-confirm-password" class="form-label">Confirm Password *</label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat password" minlength="6" required>
          </div>
        </div>

        <div style="border-top:1px dashed var(--border-color); margin:18px 0; padding-top:16px;">
          <span style="font-size:12px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em; display:block; margin-bottom:12px;">
            Optional Clinical Details
          </span>

          <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px;">
            <div class="form-group">
              <label for="reg-dob" class="form-label" style="font-size:12px;">Date of Birth</label>
              <input type="date" id="reg-dob" class="form-control">
            </div>
            <div class="form-group">
              <label for="reg-gender" class="form-label" style="font-size:12px;">Gender</label>
              <select id="reg-gender" class="form-select">
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="reg-blood" class="form-label" style="font-size:12px;">Blood Group</label>
              <select id="reg-blood" class="form-select">
                <option value="">Select</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-emergency" class="form-label" style="font-size:12px;">Emergency Contact (Name & Phone)</label>
            <input type="text" id="reg-emergency" class="form-control" placeholder="e.g. Jane Miller (+1-800-555-0131)">
          </div>
        </div>

        <div style="margin-bottom:20px; font-size:12px; color:var(--text-secondary);">
          <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer;">
            <input type="checkbox" required checked style="accent-color:var(--primary-brand); margin-top:2px;">
            <span>I agree to the clinic privacy policy and understand this account is strictly for medical appointment scheduling.</span>
          </label>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary" style="width:100%;">
          Complete Registration
        </button>
      </form>

      <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-secondary);">
        Already have an account? <a href="login.html" style="font-weight:700;">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
