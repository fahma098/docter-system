# ====================================================================
# Doctor Availability & Scheduling System Configuration
# ====================================================================

spring.application.name=doctor-scheduling-system
server.port=8080

# Active Profile: default is mysql, can be switched to 'h2' for offline/testing
spring.profiles.active=mysql

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/doctor_scheduling_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# SQL Initialization (Can be toggled to always/never)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JSON Formatting & Deserialization
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.jackson.deserialization.fail-on-unknown-properties=false

# Healthcare Clinic Branding for Receipts & System Info (Kerala, India)
clinic.name=Aura Multispeciality Hospital & Medical Research Centre, Kochi
clinic.address=Marine Drive, Ernakulam, Kochi, Kerala 682031, India
clinic.phone=+91 484 288 9000
clinic.email=appointments@aurakerala.health
clinic.website=https://aurakerala.health
clinic.currency=INR
clinic.currency-symbol=₹
clinic.cancellation-window-hours=4

# Server Logging
logging.level.root=INFO
logging.level.com.healthcare.app=DEBUG
logging.level.org.springframework.jdbc=INFO
