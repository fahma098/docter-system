# ====================================================================
# Render Blueprint Configuration (render.yaml)
# Provisions Managed PostgreSQL Database + Spring Boot Web Service
# ====================================================================

services:
  - type: web
    name: doctor-scheduling-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doctor-scheduling-db
          property: connectionString
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: postgres

databases:
  - name: doctor-scheduling-db
    databaseName: doctor_scheduling_system
    user: doctor_admin
    plan: free
    region: oregon
