<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Directory - Doctor Availability & Scheduling System</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ai-assistant.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="navbar-brand">
        <div class="brand-icon">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
        </div>
        <span>Aura Health</span>
      </a>

      <ul class="navbar-nav">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="doctors.html" class="nav-link active">Find Doctors</a></li>
        <li><a href="booking.html" class="nav-link">Book Appointment</a></li>
        <li><a href="verify-receipt.html" class="nav-link">Verify Receipt</a></li>
      </ul>

      <div class="navbar-actions" id="nav-auth-actions"></div>
    </div>
  </nav>

  <main style="padding: 40px 0 64px;">
    <div class="container">
      <!-- Directory Header -->
      <div style="margin-bottom: 28px;">
        <span style="font-size:12px;font-weight:700;color:var(--healthcare-teal);text-transform:uppercase;letter-spacing:0.05em;">Our Kerala Medical Faculty</span>
        <h1 style="font-size: 28px; font-weight: 800; color: var(--text-main); margin-top: 4px;">Specialist Doctor Directory</h1>
        <p style="font-size: 14px; color: var(--text-secondary); margin-top: 4px;">
          Explore verified medical professionals at Aura Hospital Kochi, review consultation fees in INR (₹) and qualifications, and book directly.
        </p>
      </div>

      <!-- Filters Row -->
      <div class="card" style="margin-bottom: 32px; padding: 20px;">
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) auto; gap: 16px; align-items: flex-end;">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" style="font-size: 12px;">Doctor Name / Keyword</label>
            <input type="text" id="filter-search" class="form-control" placeholder="Search by name, credentials...">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" style="font-size: 12px;">Specialization</label>
            <select id="filter-spec" class="form-select">
              <option value="">All Specializations</option>
            </select>
          </div>

          <div style="display:flex; gap:10px;">
            <button id="apply-filters-btn" class="btn btn-primary">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
              Filter Doctors
            </button>
            <button id="reset-filters-btn" class="btn btn-outline">Reset</button>
          </div>
        </div>
      </div>

      <!-- Doctor Cards Grid -->
      <div id="doctors-container" class="doctor-grid">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const searchParam = urlParams.get('search') || '';
      const specIdParam = urlParams.get('specId') || '';

      document.getElementById('filter-search').value = searchParam;

      await loadSpecializationFilter(specIdParam);
      await loadDoctors();

      document.getElementById('apply-filters-btn').addEventListener('click', loadDoctors);
      document.getElementById('reset-filters-btn').addEventListener('click', () => {
        document.getElementById('filter-search').value = '';
        document.getElementById('filter-spec').value = '';
        loadDoctors();
      });
    });

    async function loadSpecializationFilter(selectedId) {
      const select = document.getElementById('filter-spec');
      try {
        const specs = await Api.get('/specializations');
        specs.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.specializationId;
          opt.textContent = s.specializationName;
          if (String(s.specializationId) === String(selectedId)) {
            opt.selected = true;
          }
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Failed to load specializations:', err);
      }
    }

    async function loadDoctors() {
      const container = document.getElementById('doctors-container');
      container.innerHTML = `
        <div class="skeleton-card" style="height:260px;"></div>
        <div class="skeleton-card" style="height:260px;"></div>
        <div class="skeleton-card" style="height:260px;"></div>
      `;

      const search = document.getElementById('filter-search').value.trim();
      const specId = document.getElementById('filter-spec').value;

      let query = '/doctors?approvedOnly=true';
      if (search) query += `&search=${encodeURIComponent(search)}`;
      if (specId) query += `&specializationId=${specId}`;

      try {
        const doctors = await Api.get(query);
        container.innerHTML = '';

        if (!doctors || doctors.length === 0) {
          container.innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
              <div class="empty-state-icon">
                <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
              </div>
              <h3 class="empty-state-title">No Doctors Found</h3>
              <p class="empty-state-desc">No doctors match your applied search filters. Try adjusting your specialization or keyword.</p>
            </div>
          `;
          return;
        }

        doctors.forEach(doc => {
          const card = document.createElement('div');
          card.className = 'doctor-card';

          const workingDays = (doc.schedules || [])
            .filter(s => s.activeStatus)
            .map(s => s.workingDay.substring(0, 3))
            .join(', ');

          card.innerHTML = `
            <div class="doctor-card-top">
              <img src="${doc.profileImageUrl || 'images/default-doctor.svg'}" onerror="this.onerror=null; this.src='images/default-doctor.svg';" class="doctor-avatar" alt="${escapeHtml(doc.fullName)}">
              <div class="doctor-card-info">
                <h3 class="doctor-name">${escapeHtml(doc.fullName)}</h3>
                <span class="doctor-spec">${escapeHtml(doc.specializationName)}</span>
                <div class="doctor-qual">${escapeHtml(doc.qualifications)}</div>
                <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">License: ${escapeHtml(doc.licenseNumber)}</div>
                <div style="font-size:11px;color:var(--healthcare-teal);font-weight:600;margin-top:2px;">📍 Aura Hospital, Kochi</div>
              </div>
            </div>
            <div class="doctor-card-body">
              <p class="doctor-bio">${escapeHtml(doc.professionalBio || 'Certified specialist medical doctor at Aura Health Kochi.')}</p>
              <div class="doctor-meta-row" style="margin-bottom:8px;">
                <span>Experience: <strong>${doc.experienceYears} Years</strong></span>
                <span>Fee: <strong class="doctor-fee">${Api.formatCurrency(doc.consultationFee)}</strong></span>
              </div>
              <div style="font-size:11px;color:var(--text-secondary);">
                📅 Active Days: <strong style="color:var(--text-main);">${workingDays || 'Mon - Fri'}</strong>
              </div>
            </div>
            <div class="doctor-card-footer">
              <a href="booking.html?doctorId=${doc.doctorId}" class="btn btn-primary btn-sm" style="flex:1;">
                Book Appointment
              </a>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `<div style="grid-column: 1/-1; color:var(--status-error); text-align:center;">Failed to load directory: ${err.message}</div>`;
      }
    }
  </script>
  <script src="js/ai-assistant.js"></script>
</body>
</html>
